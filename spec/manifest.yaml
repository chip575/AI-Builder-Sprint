# 오케스트레이터는 이 파일만 읽는다. 스펙 본문도 코드도 읽지 않는다.
# 워커에게는 자기 행 + in/out 계약 파일 + fr 파일 1개만 준다.
# status: todo | wip | done | blocked
# owner: be1 | be2 | fe | pm

meta:
  contracts_dir: lib/contracts
  frozen_after: M0          # M0 관통 후 계약 동결. 이후 변경은 contract-owner 경유
  parallel_from: M1         # M0는 단일 세션 관통 (decisions.md D-14)

